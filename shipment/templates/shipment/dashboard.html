<!doctype html>
<html>
  <head>
    <title>Enterprise Logistics Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <h2 class="text-center mb-4">🚚 Enterprise Shipment Management</h2>

      <!-- Create Shipment -->
      <div class="card mb-4 shadow">
        <div class="card-header bg-primary text-white">Create Shipment</div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col">
              <input
                type="text"
                id="tracking"
                class="form-control"
                placeholder="Tracking Number"
              />
            </div>
            <div class="col">
              <input
                type="text"
                id="customer"
                class="form-control"
                placeholder="Customer Name"
              />
            </div>
            <div class="col">
              <input
                type="text"
                id="phone"
                class="form-control"
                placeholder="Phone"
              />
            </div>
            <div class="col">
              <input
                type="text"
                id="pickup"
                class="form-control"
                placeholder="Pickup Address"
              />
            </div>
            <div class="col">
              <input
                type="text"
                id="delivery"
                class="form-control"
                placeholder="Delivery Address"
              />
            </div>
          </div>

          <button class="btn btn-success mt-3" onclick="createShipment()">
            Create Shipment
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="card mb-4 shadow">
        <div class="card-header bg-dark text-white">Search Shipment</div>
        <div class="card-body">
          <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Search by tracking/customer"
          />
          <button class="btn btn-secondary mt-2" onclick="loadShipments()">
            Search
          </button>
        </div>
      </div>

      <!-- Shipment Table -->
      <div class="card shadow">
        <div class="card-header bg-info text-white">All Shipments</div>
        <div class="card-body">
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>Select</th>
                <th>Tracking</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="shipmentTable"></tbody>
          </table>

          <div class="mt-3">
            <select id="bulkStatus" class="form-select w-25 d-inline">
              <option value="Assigned">Assigned</option>
              <option value="Picked Up">Picked Up</option>
              <option value="In Transit">In Transit</option>
              <option value="Out for Delivery">Out for Delivery</option>
            </select>
            <button class="btn btn-warning" onclick="bulkUpdate()">
              Bulk Update
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      function createShipment() {
        fetch("/api/shipments/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            tracking_number: document.getElementById("tracking").value,
            customer_name: document.getElementById("customer").value,
            customer_phone: document.getElementById("phone").value,
            pickup_address: document.getElementById("pickup").value,
            delivery_address: document.getElementById("delivery").value,
          }),
        })
          .then((res) => res.json())
          .then(() => {
            alert("Shipment Created!");
            loadShipments();
          });
      }

      function loadShipments() {
        let search = document.getElementById("search").value;
        let url = "/api/shipments/";
        if (search) url += "?search=" + search;

        fetch(url)
          .then((res) => res.json())
          .then((data) => {
            let table = document.getElementById("shipmentTable");
            table.innerHTML = "";

            data.forEach((shipment) => {
              table.innerHTML += `
                <tr>
                    <td><input type="checkbox" value="${shipment.id}"></td>
                    <td>${shipment.tracking_number}</td>
                    <td>${shipment.customer_name}</td>
                    <td>${shipment.status}</td>
                    <td>
                        <button class="btn btn-sm btn-success" onclick="updateStatus('${shipment.id}','Assigned')">Assign</button>
                        <button class="btn btn-sm btn-primary" onclick="updateStatus('${shipment.id}','Delivered')">Deliver</button>
                        <button class="btn btn-sm btn-danger" onclick="cancelShipment('${shipment.id}')">Cancel</button>
                        <button class="btn btn-sm btn-dark" onclick="markRTO('${shipment.id}')">RTO</button>
                    </td>
                </tr>
            `;
            });
          });
      }

      function updateStatus(id, status) {
        fetch(`/api/shipments/${id}/update_status/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            status: status,
          }),
        }).then(() => loadShipments());
      }

      function cancelShipment(id) {
        fetch(`/api/shipments/${id}/cancel/`, {
          method: "POST",
        }).then(() => loadShipments());
      }

      function markRTO(id) {
        fetch(`/api/shipments/${id}/mark_rto/`, {
          method: "POST",
        }).then(() => loadShipments());
      }

      function bulkUpdate() {
        let checkboxes = document.querySelectorAll(
          "input[type='checkbox']:checked",
        );
        let ids = [];
        checkboxes.forEach((cb) => ids.push(cb.value));

        fetch("/api/shipments/bulk_update_status/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            ids: ids,
            status: document.getElementById("bulkStatus").value,
          }),
        }).then(() => loadShipments());
      }

      loadShipments();
    </script>
  </body>
</html>
