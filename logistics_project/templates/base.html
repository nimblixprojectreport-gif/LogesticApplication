<!DOCTYPE html>
<html>
<head>
    <title>Logistics System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
        }

        .wrapper {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #2c5aa0, #1f3f73);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .sidebar a:hover {
            background-color: rgba(255,255,255,0.15);
        }

        /* Content */
        .content {
            flex: 1;
            padding: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        h1 {
            margin-top: 0;
        }

        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .btn-green {
            background-color: #28a745;
        }

        .btn-red {
            background-color: #dc3545;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align:left;
        }

        table th {
            background: #f1f1f1;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

    </style>
</head>
<body>

<div class="wrapper">
    <div class="sidebar">
        <h2>Logistics</h2>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'vehicle_list' %}">Vehicles</a>
        <a href="{% url 'webhook_page' %}">Webhooks</a>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</div>

</body>
</html>
