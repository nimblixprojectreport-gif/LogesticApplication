{% extends 'base.html' %}
{% block content %}

<div class="card">
    <h2>Add Vehicle</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Number</label>
        <input type="text" name="number" required>

        <label>Type</label>
        <input type="text" name="type" required>

        <button type="submit" class="btn-green">Save</button>
    </form>
</div>

{% endblock %}
